<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5efeb">
<title>A Little Company — for Kami</title>
<style>
:root{
 --bg:#f5efeb;--paper:#fffaf7;--ink:#30282a;--muted:#897a7d;--wine:#7a4054;--rose:#c27d92;--line:#e9dcda;
 --shadow:0 18px 60px rgba(61,39,45,.10);--radius:30px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:smooth}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;transition:.35s}
button{font:inherit}button:focus-visible{outline:3px solid rgba(122,64,84,.25);outline-offset:3px}
#app{min-height:100dvh}.page{min-height:100dvh;padding:16px 14px calc(50px + env(safe-area-inset-bottom))}.wrap{width:min(100%,560px);margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;color:var(--muted);font-size:12px}.brand{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--wine)}
.datepill{padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.63);border:1px solid rgba(255,255,255,.84);backdrop-filter:blur(12px);white-space:nowrap}
.prev{border:0;background:transparent;color:var(--muted);font-weight:700;padding:7px 0;cursor:pointer}.prev.hidden{visibility:hidden}
.hero,.section,.nextbox{background:rgba(255,250,247,.88);border:1px solid rgba(255,255,255,.82);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.hero{padding:31px 23px 27px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-130px;top:-135px;background:radial-gradient(circle,rgba(225,187,199,.56),transparent 67%);pointer-events:none}
.section{padding:22px;margin-top:15px}.section.flush{padding:0;overflow:hidden}.section.dark{background:#2b2528;border-color:#3b3336;color:#f7efec}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.21em;color:var(--rose);font-weight:900}.stepnum{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#f0e0e5;color:var(--wine);font-size:11px;font-weight:900;margin-bottom:11px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500}h1{font-size:45px;line-height:.98;letter-spacing:-1.7px;margin:12px 0 13px}h2{font-size:33px;line-height:1.05;letter-spacing:-.9px;margin:8px 0 10px}h3{font-size:23px;margin:6px 0 8px}
p{font-size:15px;line-height:1.6;color:#6e6063;margin:8px 0 14px}.small{font-size:12px;color:var(--muted);line-height:1.5}.center{text-align:center}
.introNote{padding:13px 15px;background:#f5e8ec;border-radius:17px;color:#724658;font-size:13px;margin-top:16px}
.videoShell{background:#151214;border-radius:24px;padding:8px;margin-top:16px;box-shadow:0 18px 40px rgba(28,17,20,.17)}video{display:block;width:100%;max-height:70dvh;border-radius:17px;background:#111;object-fit:contain}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.chip{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px 8px;color:var(--wine);font-size:12px;font-weight:800;cursor:pointer}.chip.active{background:var(--wine);color:white;border-color:var(--wine)}
.revealBox{min-height:96px;border-radius:18px;background:#f8f1ef;border:1px solid var(--line);padding:17px;display:grid;place-items:center;text-align:center;margin-top:10px;font-family:Georgia,serif;font-size:18px;line-height:1.42;color:#56474a}
.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.miniCard{border:1px solid var(--line);background:#fff;border-radius:20px;padding:16px;min-height:122px}.miniCard b{display:block;font-size:13px;margin-bottom:7px}.miniCard span{font-size:12px;line-height:1.45;color:var(--muted)}
.fullPhoto{position:relative;border-radius:24px;overflow:hidden;background:#d9ced1;margin-top:14px;min-height:260px}.fullPhoto .blur{position:absolute;inset:-18px;width:calc(100% + 36px);height:calc(100% + 36px);object-fit:cover;filter:blur(24px) brightness(.72);transform:scale(1.08)}.fullPhoto .main{position:relative;z-index:1;display:block;width:100%;height:auto;max-height:72dvh;object-fit:contain;background:rgba(20,16,18,.08)}
.primary,.secondary,.ghost{width:100%;border-radius:17px;padding:15px 16px;font-weight:850;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#71394d,#a85f78);color:white;box-shadow:0 10px 26px rgba(122,64,84,.19)}.secondary{border:1px solid var(--line);background:#fff;color:var(--wine)}.ghost{border:1px dashed #d8c5ca;background:transparent;color:var(--wine)}
.nextArea{padding-top:23px}.nextbox{padding:17px}.nextlabel{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);font-weight:900;margin-bottom:9px}.nextBtn{width:100%;border:0;border-radius:17px;padding:15px;background:linear-gradient(135deg,#71394d,#a85f78);color:#fff;font-weight:850;cursor:pointer}.nextBtn:disabled{background:#e7dddf;color:#9d8d91;cursor:not-allowed}.count{font-variant-numeric:tabular-nums}
.rule{height:1px;background:var(--line);margin:18px 0}
.progressDots{display:flex;justify-content:center;gap:6px;margin:14px 0 0}.progressDots i{width:7px;height:7px;border-radius:50%;background:#dbcdd0}.progressDots i.done{background:var(--wine)}
/* day 2 */
body.day2{--bg:#f1ece6;--wine:#6e5047;--rose:#b58a7c;--line:#e5d9d1}.vending{padding:22px 8px 8px;text-align:center}.vendButton{width:214px;height:214px;border:0;border-radius:50%;background:radial-gradient(circle at 34% 29%,#ddb7aa,#9b6d62 58%,#684940 100%);color:#fff;box-shadow:0 26px 60px rgba(104,73,64,.23);font-family:Georgia,serif;font-size:23px;cursor:pointer}.vendButton:active{transform:scale(.97)}
.randomBox{position:relative;overflow:hidden;min-height:175px;margin-top:16px;border:1px solid var(--line);border-radius:23px;background:#fff;display:grid;place-items:center;text-align:center;padding:19px}.randomBox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#efe7e4;opacity:0}.randomBox.photo img{opacity:1}.randomText{position:relative;z-index:2;font-family:Georgia,serif;font-size:19px;line-height:1.4}.randomBox.photo .randomText{background:rgba(32,24,22,.55);color:white;padding:11px 13px;border-radius:14px;backdrop-filter:blur(5px)}
.moodGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mood{border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px 7px;cursor:pointer}.mood .emoji{display:block;font-size:24px;margin-bottom:5px}.mood small{font-weight:800;color:#76574f}.moodReply{min-height:88px;padding:15px;border-radius:18px;background:#f7f1ec;margin-top:10px;display:grid;place-items:center;text-align:center;font-size:14px;color:#654f49}
.gameStage{position:relative;height:290px;border-radius:24px;overflow:hidden;background:linear-gradient(#f5e8e2,#efe0d9);border:1px solid var(--line);margin-top:12px}.catchHeart{position:absolute;border:0;background:transparent;font-size:33px;cursor:pointer;transition:.12s}.gameHUD{display:flex;justify-content:space-between;font-size:12px;font-weight:850;color:#78584f;margin-top:9px}
/* day 3 */
body.day3{--bg:#eaf0f1;--wine:#45626b;--rose:#7ea0a8;--line:#d7e2e4}.develop{position:relative;border-radius:25px;overflow:hidden;background:#cbd5d7;margin-top:14px}.develop img{display:block;width:100%;height:auto;max-height:72dvh;object-fit:contain;filter:blur(19px) saturate(.65);transform:scale(1.035);transition:filter 2.2s,transform 2.2s}.develop.done img{filter:blur(0) saturate(1);transform:scale(1)}.developLayer{position:absolute;inset:0;display:grid;place-items:center;background:rgba(36,55,60,.23);touch-action:none;transition:.35s}.develop.done .developLayer{opacity:0;pointer-events:none}.developChip{padding:13px 16px;border-radius:999px;background:rgba(255,255,255,.91);font-weight:850;color:#48636b}.bar{height:5px;border-radius:999px;background:#d5e1e3;overflow:hidden;margin-top:10px}.bar i{display:block;width:0;height:100%;background:#648a94}.afterDevelop{display:none}.afterDevelop.show{display:block}
.memoryNav{display:flex;gap:8px;overflow:auto;padding:4px 0 2px;scrollbar-width:none}.memoryNav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;color:var(--wine);font-weight:800;cursor:pointer}.memoryNav button.active{background:var(--wine);color:#fff}.memoryDisplay{margin-top:11px}
/* day4 */
body.day4{--bg:#f2e9ed;--wine:#824a62;--rose:#bd7e98;--line:#e7d6dd}.envelopes{display:grid;gap:10px;margin-top:13px}.envelope{border:1px solid var(--line);background:#fff;border-radius:20px;padding:17px;text-align:left;cursor:pointer}.envelope b{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#754157}.envelope .inside{display:none;padding-top:11px;color:#6e5d63;line-height:1.55;font-size:13px}.envelope.open .inside{display:block}.kissCounter{display:grid;place-items:center;padding:10px 0}.kissBtn{width:148px;height:148px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#f3d9e2,#c9829c 63%,#9d5971);color:#fff;font-size:44px;box-shadow:0 22px 50px rgba(129,74,98,.20);cursor:pointer}.kissCount{font-family:Georgia,serif;font-size:28px;color:var(--wine);margin-top:9px}.pulseGame{height:210px;border-radius:24px;background:linear-gradient(145deg,#f6e7ed,#ead4dd);display:grid;place-items:center;position:relative;overflow:hidden}.pulseHeart{width:90px;height:90px;border-radius:50%;border:0;background:white;color:#a85d77;font-size:38px;cursor:pointer;box-shadow:0 13px 32px rgba(115,64,82,.13)}.pulseHeart.pulse{animation:pulse .5s}@keyframes pulse{50%{transform:scale(1.25)}}
/* day5 */
body.day5{--bg:#f0ebe6;--wine:#734c40;--rose:#ae7866;--line:#e3d8d2}.loveGenerator{min-height:120px;border:1px solid var(--line);background:#fff;border-radius:22px;padding:18px;display:grid;place-items:center;text-align:center;font-family:Georgia,serif;font-size:20px;color:#5f473f;margin-top:12px}.photoStack{display:grid;gap:12px}.holdRing{--p:0%;width:184px;height:184px;border-radius:50%;margin:25px auto 8px;background:conic-gradient(#9a6250 var(--p),#e7dbd4 0);display:grid;place-items:center;position:relative}.holdRing:before{content:"";position:absolute;inset:9px;border-radius:50%;background:#fffaf6}.holdRing button{position:relative;z-index:2;width:140px;height:140px;border:0;background:transparent;color:#744c40;font-weight:850;touch-action:none;user-select:none}.finalReveal{display:none;text-align:center}.finalReveal.show{display:block}
/* day6 */
body.day6{--bg:#211d1f;--paper:#2c2729;--ink:#f7eeeb;--muted:#b8aaad;--wine:#e2c0a1;--rose:#bb9274;--line:#44393e;color:#f7eeeb}body.day6 p{color:#d1c3c3}body.day6 .hero,body.day6 .section,body.day6 .nextbox{background:#2c2729;border-color:#3e3539;box-shadow:0 18px 60px rgba(0,0,0,.22)}body.day6 .datepill{background:#312b2d;border-color:#40373a}body.day6 .revealBox{background:#352e31;border-color:#493d42;color:#ecd9cb}
.clueButton{width:100%;border:1px solid #56484d;background:#393134;color:#f8efeb;border-radius:17px;padding:15px;font-weight:850;cursor:pointer}.clueResult{min-height:50px;display:grid;place-items:center;color:#e3cab4;font-size:14px}.seal{width:190px;height:190px;margin:18px auto;border-radius:50%;border:1px solid #5b4b51;display:grid;place-items:center;background:radial-gradient(circle,#3c3336,#292326);box-shadow:0 20px 50px rgba(0,0,0,.25)}.seal span{font-family:Georgia,serif;color:#dfbea0;font-size:21px;text-align:center;line-height:1.25}.stay{font-family:Georgia,serif;font-size:30px;color:#e2c0a1;text-align:center;margin-top:18px}
.heartFloat{position:fixed;z-index:300;pointer-events:none;font-size:21px;color:#b95f7b;animation:fly 1s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),-120px) rotate(var(--r));opacity:0}}
.testbar{display:none;width:min(calc(100% - 28px),560px);margin:10px auto 0;background:#181516;color:#fff;border-radius:18px;padding:10px;position:relative;z-index:999;box-shadow:0 12px 40px rgba(0,0,0,.25)}.testbar.show{display:block}.testtitle{font-size:10px;font-weight:900;letter-spacing:.12em;margin-bottom:7px}.testgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.testgrid button,.testreal{border:0;border-radius:10px;background:#393033;color:#fff;padding:9px 5px;font-size:11px}.testreal{width:100%;margin-top:6px;background:#704153}.footerSecret{text-align:center;color:#b4a4a7;font-size:10px;margin:20px 0 2px;user-select:none}
@media(max-width:390px){h1{font-size:40px}.hero,.section{padding:20px}.chips,.moodGrid{grid-template-columns:1fr}.twoCol{grid-template-columns:1fr}.vendButton{width:190px;height:190px}}
</style>
</head>
<body>
<div class="testbar " id="testbar"><div class="testtitle">TEST MODE — JUMP TO ANY DAY</div><div class="testgrid"><button data-test="0">28 Sep</button><button data-test="1">29 Sep</button><button data-test="2">30 Sep</button><button data-test="3">1 Oct</button><button data-test="4">2 Oct</button><button data-test="5">3 Oct</button></div><button class="testreal" id="realBtn">Use real time</button></div>
<div id="app"></div>
<script>
const MEDIA={"boat": "assets/boat.jpg", "solo": "assets/solo.jpg", "bathroom": "assets/bathroom.jpg", "night": "assets/night.jpg", "mirror": "assets/mirror.jpg", "beach": "assets/beach.jpg", "video1": "assets/video1.mp4", "video2": "assets/video2.mp4", "video3": "assets/video3.mp4"};
const TEST_DEFAULT=false;
const chapters=[
 {date:'28 SEP',unlock:'2026-09-27T22:00:00Z',type:'d1'},
 {date:'29 SEP',unlock:'2026-09-28T22:00:00Z',type:'d2'},
 {date:'30 SEP',unlock:'2026-09-29T22:00:00Z',type:'d3'},
 {date:'1 OCT',unlock:'2026-09-30T22:00:00Z',type:'d4'},
 {date:'2 OCT',unlock:'2026-10-01T22:00:00Z',type:'d5'},
 {date:'3 OCT',unlock:'2026-10-02T22:00:00Z',type:'d6'}
];
let sim=TEST_DEFAULT?0:null;
let current=TEST_DEFAULT?0:Math.max(0,Math.min(5,Number(localStorage.getItem('kami_big_current')||0)));
let secretTaps=0;
const app=document.getElementById('app');
function now(){return sim===null?Date.now():new Date(chapters[sim].unlock).getTime()+1000}
function open(i){return i>=0&&i<chapters.length&&now()>=new Date(chapters[i].unlock).getTime()}
function italyClock(){try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit'}).format(new Date())}catch(e){return'Italy'}}
function cd(ms){if(ms<=0)return'UNLOCKED';let t=Math.floor(ms/1000),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=t%60;return d?`${d}d ${h}h ${m}m`:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function top(i){return `<div class="top"><button class="prev ${i===0?'hidden':''}" id="prevBtn">← previous</button><span class="brand">A Little Company</span><span class="datepill">${chapters[i].date} · ${italyClock()}</span></div>`}
function next(i){if(i===5)return'';let ok=open(i+1),left=new Date(chapters[i+1].unlock).getTime()-now();return `<div class="nextArea"><div class="nextbox"><div class="nextlabel">THE NEXT PART</div><button class="nextBtn" id="nextBtn" ${ok?'':'disabled'}>${ok?`OPEN ${chapters[i+1].date}`:`UNLOCKS AT MIDNIGHT · <span class="count">${cd(left)}</span>`}</button><div class="progressDots">${chapters.map((_,k)=>`<i class="${k<=i?'done':''}"></i>`).join('')}</div></div></div>`}
function shell(i,body){document.body.className='day'+(i+1);return `<main class="page"><div class="wrap">${top(i)}${body}${next(i)}<div class="footerSecret" id="secret">for Kami ♡</div></div></main>`}
function photo(src,alt='memory'){return `<div class="fullPhoto"><img class="blur" src="${src}" alt=""><img class="main" src="${src}" alt="${alt}"></div>`}
function video(src){return `<div class="videoShell"><video controls playsinline preload="metadata"><source src="${src}" type="video/mp4">Your browser cannot play this video.</video></div>`}
function bind(i){const p=document.getElementById('prevBtn');if(p&&i>0)p.onclick=()=>{current=i-1;save();render();scrollTo(0,0)};const n=document.getElementById('nextBtn');if(n&&!n.disabled)n.onclick=()=>{current=i+1;save();render();scrollTo(0,0)};const s=document.getElementById('secret');if(s)s.onclick=()=>{secretTaps++;if(secretTaps>=7){document.getElementById('testbar').classList.toggle('show');secretTaps=0}}}
function save(){if(!TEST_DEFAULT)localStorage.setItem('kami_big_current',String(current))}
function render(){if(!open(current)&&sim===null)current=0;const t=chapters[current].type;if(t==='d1')day1();if(t==='d2')day2();if(t==='d3')day3();if(t==='d4')day4();if(t==='d5')day5();if(t==='d6')day6();bind(current)}
function day1(){app.innerHTML=shell(0,`
<section class="hero"><div class="eyebrow">DAY ONE · START HERE</div><h1>Five days.<br>A little company.</h1><p>You’re going to be on your own for a few days, so I made you a place to come back to. Not a mission, not a quiz, not something you have to finish. Just something new every night.</p><div class="introNote">Only this first page explains it. From tomorrow, you just open the next part and see what happens.</div></section>
<section class="section"><div class="stepnum">01</div><div class="eyebrow">FIRST, ME</div><h2>Watch this before anything else.</h2><p>I can explain this better than a website can.</p>${video(MEDIA.video1)}</section>
<section class="section"><div class="stepnum">02</div><div class="eyebrow">HOW TO USE THIS PLACE</div><h2>No rules, basically.</h2><div class="twoCol"><div class="miniCard"><b>Come back at midnight</b><span>A new part unlocks at 00:00 Italy time.</span></div><div class="miniCard"><b>Old parts stay yours</b><span>You can always go back if you want to see something again.</span></div><div class="miniCard"><b>Press things</b><span>There are little hidden pieces, buttons and stupid surprises.</span></div><div class="miniCard"><b>Don’t overthink it</b><span>I just wanted to be a little bit there with you.</span></div></div></section>
<section class="section"><div class="stepnum">03</div><div class="eyebrow">IF YOU NEED ME</div><h2>Pick one.</h2><div class="chips"><button class="chip" data-first="quiet">too quiet</button><button class="chip" data-first="bored">bored</button><button class="chip" data-first="miss">miss me</button></div><div class="revealBox" id="firstReply">Choose what kind of company you need.</div></section>
<section class="section"><div class="stepnum">04</div><div class="eyebrow">A TINY START</div><h2>One photo for day one.</h2><p>Not because this is the photo day. Just because I like us here.</p>${photo(MEDIA.beach,'Us')}</section>
`);document.querySelectorAll('[data-first]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-first]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const r={quiet:'Then keep this open for a minute. I’m technically here now.',bored:'Perfect. Tomorrow gets more stupid. In a good way.',miss:'I miss you too. That part is unfortunately very real.'};document.getElementById('firstReply').textContent=r[b.dataset.first]})}
const vending=[{t:'Remote boyfriend presence: activated.'},{t:'If it gets too quiet, call me. No appointment needed.'},{t:'I miss you. That was literally the whole surprise.'},{t:'Drink some water. Romance, but responsible.'},{t:'You get one completely unnecessary photo.',img:'bathroom'},{t:'Okay, one pretty one.',img:'solo'},{t:'Do absolutely nothing for five minutes. I approved it.'},{t:'Tiny hug delivered. Please sign here: ♡'}];let bag=[];function draw(){if(!bag.length)bag=[...vending].sort(()=>Math.random()-.5);return bag.pop()}
function day2(){app.innerHTML=shell(1,`
<section class="hero"><div class="eyebrow">DAY TWO</div><h1>Today is for pressing things.</h1><p>No long introduction today. You already know why you’re here.</p></section>
<section class="section center"><div class="stepnum">01</div><div class="eyebrow">BOYFRIEND VENDING MACHINE</div><h2>Press for company.</h2><div class="vending"><button class="vendButton" id="vend">PRESS<br>ME</button></div><div class="randomBox" id="randomBox"><img id="randomImg"><div class="randomText" id="randomText">You haven’t pressed it yet.</div></div><p class="small">Yes, you can press it more than once.</p></section>
<section class="section"><div class="stepnum">02</div><div class="eyebrow">WHAT DO YOU NEED?</div><h2>Choose your current mood.</h2><div class="moodGrid"><button class="mood" data-mood="company"><span class="emoji">☁️</span><small>company</small></button><button class="mood" data-mood="laugh"><span class="emoji">🙂</span><small>make me laugh</small></button><button class="mood" data-mood="hug"><span class="emoji">♡</span><small>a hug</small></button></div><div class="moodReply" id="moodReply">Pick one. I’ll do my best from another country.</div></section>
<section class="section"><div class="stepnum">03</div><div class="eyebrow">10-SECOND DISTRACTION</div><h2>Catch the hearts.</h2><p>Tap as many as you can before the timer ends. Completely useless. Exactly the point.</p><button class="primary" id="startGame">START</button><div class="gameStage" id="gameStage"></div><div class="gameHUD"><span>score: <b id="score">0</b></span><span>time: <b id="time">10</b>s</span></div></section>
<section class="section"><div class="stepnum">04</div><div class="eyebrow">PROOF I CAN BE SERIOUS</div><h2>For exactly one second.</h2>${photo(MEDIA.solo,'Kami')}<div class="introNote center">Okay. Enough seriousness for today.</div></section>
`);document.getElementById('vend').onclick=()=>{let s=draw(),box=document.getElementById('randomBox'),img=document.getElementById('randomImg');document.getElementById('randomText').textContent=s.t;if(s.img){img.src=MEDIA[s.img];box.classList.add('photo')}else{img.removeAttribute('src');box.classList.remove('photo')}};const mood={company:'Keep the page open. Do your thing. I’ll sit here quietly and judge your choices.',laugh:'I built a boyfriend vending machine. My dignity is already gone.',hug:'Consider this an aggressively long-distance hug. No escape.'};document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>document.getElementById('moodReply').textContent=mood[b.dataset.mood]);setupCatch()}
