<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A Little Company</title><style>
:root{
  --bg:#f6f0ec;--paper:#fffaf7;--ink:#2f282a;--muted:#8e7d81;
  --rose:#8d4c63;--rose2:#c9859a;--line:#eaded9;--shadow:0 16px 48px rgba(55,36,42,.10)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh}
button{font:inherit}
#app{min-height:100dvh}
.page{min-height:100dvh;padding:20px 14px 46px}
.wrap{width:min(100%,560px);margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;color:var(--muted);font-size:12px}
.brand{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.datepill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9)}
.hero,.section{background:rgba(255,250,247,.92);border:1px solid rgba(255,255,255,.9);border-radius:28px;box-shadow:var(--shadow)}
.hero{padding:30px 24px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-120px;top:-120px;background:radial-gradient(circle,rgba(231,194,204,.55),transparent 70%)}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:800;color:var(--rose2)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500}
h1{font-size:44px;line-height:.98;letter-spacing:-1.5px;margin:10px 0 14px}
h2{font-size:31px;line-height:1.08;margin:8px 0 10px}
h3{font-size:23px;margin:8px 0}
p{font-size:15px;line-height:1.62;color:#6f6265}
.section{padding:22px;margin-top:16px}
.note{padding:14px 15px;border-radius:18px;background:#f5e9ed;color:#724759;font-size:13px;line-height:1.5}
.video{background:#171315;border-radius:23px;padding:8px;margin-top:14px}
video{width:100%;display:block;border-radius:17px;max-height:66dvh;background:#111}
.fullphoto{width:100%;height:auto;display:block;border-radius:22px;margin-top:14px;object-fit:contain;background:#eee}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.miniCard{border:1px solid var(--line);background:#fff;border-radius:18px;padding:15px}
.miniCard strong{display:block;font-size:13px;margin-bottom:5px}.miniCard span{font-size:12px;color:var(--muted);line-height:1.4}
.bigbtn,.softbtn,.choice{width:100%;border:0;border-radius:17px;padding:15px 16px;font-weight:800;cursor:pointer}
.bigbtn{background:linear-gradient(135deg,#784258,#a75d76);color:#fff;box-shadow:0 10px 25px rgba(120,66,88,.18)}
.softbtn{background:#f1e6e9;color:#7a4357}
.choice{background:#fff;border:1px solid var(--line);color:#624d53;margin-top:8px}
.reveal{display:none}.reveal.show{display:block}
.center{text-align:center}
.randomBox{min-height:140px;border:1px solid var(--line);background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;margin-top:12px;font-family:Georgia,serif;font-size:20px;line-height:1.35}
.moodResult{display:none;margin-top:12px;padding:15px;border-radius:18px;background:#fff;border:1px solid var(--line);font-size:14px;color:#69585d}
.moodResult.show{display:block}
.memoryWrap{position:relative;margin-top:14px;border-radius:24px;overflow:hidden;background:#ddd}
.memoryWrap img{width:100%;display:block;filter:blur(18px);transform:scale(1.04);transition:1.8s ease}
.memoryWrap.done img{filter:blur(0);transform:scale(1)}
.memoryOverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(39,30,33,.22);touch-action:none}
.memoryWrap.done .memoryOverlay{opacity:0;pointer-events:none}
.memoryChip{background:rgba(255,255,255,.92);padding:12px 16px;border-radius:999px;font-weight:800;color:#684456}
.progress{height:5px;border-radius:999px;background:#eadde1;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:#9b586e}
.kissBtn{width:86px;height:86px;border-radius:50%;border:0;background:#f0dbe2;color:#944d66;font-size:31px;cursor:pointer}
.counter{font-family:Georgia,serif;font-size:30px;margin:8px 0}
.holdRing{--p:0%;width:172px;height:172px;border-radius:50%;margin:22px auto;background:conic-gradient(#9c5b70 var(--p),#eadfe2 0);display:grid;place-items:center;position:relative}
.holdRing:before{content:"";position:absolute;inset:9px;border-radius:50%;background:#fffaf7}
.holdRing button{position:relative;z-index:2;width:134px;height:134px;border-radius:50%;border:0;background:transparent;color:#7f465a;font-weight:800;touch-action:none}
.next{margin-top:20px;padding:18px;border-radius:23px;background:#2f282a;color:#fff}
.next .small{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#cdbdc1;font-weight:800;margin-bottom:8px}
.next p{color:#e8dcdf;margin:0 0 12px}
.next button{width:100%;border:0;border-radius:15px;padding:14px;font-weight:800}
.next button.ready{background:#fff;color:#3a2f33;cursor:pointer}.next button.locked{background:#4d4246;color:#a99ba0}
.footer{text-align:center;font-size:10px;color:#b4a3a7;margin-top:18px}
.testbar{width:min(100% - 28px,560px);margin:10px auto 0;background:#1f1a1c;color:white;padding:10px;border-radius:16px;display:none}
.testbar.show{display:block}.testgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.testgrid button{border:0;border-radius:9px;padding:8px;background:#3b3235;color:#fff;font-size:11px}
body.d2{--bg:#f0ebe7;--rose:#6b514c;--rose2:#ad7a6b}
body.d3{--bg:#eaf0f1;--rose:#47636b;--rose2:#7aa0a9;--line:#d9e4e6}
body.d4{--bg:#f3e9ed;--rose:#854b60;--rose2:#c27f95}
body.d5{--bg:#eee8e3;--rose:#6f4d41;--rose2:#b47d69}
body.d6{--bg:#211d1f;--paper:#2d2729;--ink:#f5ece8;--muted:#b8a9ad;--rose:#e1c0a5;--rose2:#b89274;--line:#43393d}
body.d6 p{color:#cfc2c4}body.d6 .hero,body.d6 .section{background:#2b2527;border-color:#3b3235}
body.d6 .next{display:none}
@media(max-width:390px){h1{font-size:39px}.hero,.section{padding:20px}.grid2{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const DAYS=[
 {date:'28 SEP',unlock:'2026-09-27T22:00:00Z'},
 {date:'29 SEP',unlock:'2026-09-28T22:00:00Z'},
 {date:'30 SEP',unlock:'2026-09-29T22:00:00Z'},
 {date:'1 OCT',unlock:'2026-09-30T22:00:00Z'},
 {date:'2 OCT',unlock:'2026-10-01T22:00:00Z'},
 {date:'3 OCT',unlock:'2026-10-02T22:00:00Z'}
];
let current=0;
let sim=null;
const app=document.getElementById('app');

function now(){return sim===null?Date.now():new Date(DAYS[sim].unlock).getTime()+1000}
function open(i){return now()>=new Date(DAYS[i].unlock).getTime()}
function cd(ms){if(ms<=0)return'UNLOCKED';let t=Math.floor(ms/1000),d=Math.floor(t/86400),h=Math.floor((t%86400)/3600),m=Math.floor((t%3600)/60),s=t%60;return d?`${d}d ${h}h ${m}m`:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function rome(){try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit'}).format(new Date())}catch(e){return'Italy'}}
function shell(content,i){
 document.body.className='d'+(i+1);
 return `<main class="page"><div class="wrap"><div class="top"><span class="brand">A Little Company</span><span class="datepill">${DAYS[i].date} · ${rome()}</span></div>${content}${nextBlock(i)}<div class="footer">for Kami ♡</div></div></main>`
}
function nextBlock(i){
 if(i===5)return'';
 const ok=open(i+1),remain=new Date(DAYS[i+1].unlock).getTime()-now();
 return `<div class="next"><div class="small">NEXT LITTLE THING</div><p>${ok?'It is open now.':`Come back at midnight. Next unlock in <strong id="countdown">${cd(remain)}</strong>.`}</p><button id="nextBtn" class="${ok?'ready':'locked'}" ${ok?'':'disabled'}>${ok?`OPEN ${DAYS[i+1].date}`:'LOCKED UNTIL MIDNIGHT'}</button></div>`
}
function video(name){return `<div class="video"><video controls playsinline preload="metadata"><source src="${name}" type="video/mp4"><source src="${name}" type="video/quicktime">Your browser cannot play this video.</video></div>`}
function bindNext(i){let b=document.getElementById('nextBtn');if(b&&!b.disabled)b.onclick=()=>{current=i+1;render()}}
function render(){
 if(!open(current))current=0;
 if(current===0)day1();if(current===1)day2();if(current===2)day3();if(current===3)day4();if(current===4)day5();if(current===5)day6();
 bindNext(current)
}
function day1(){
 app.innerHTML=shell(`
 <section class="hero"><div class="kicker">DAY ONE</div><h1>Five days.<br>One little place.</h1><p>You’re going to be on your own for a few days, so I made you somewhere to come back to. Nothing dramatic. Just a little bit of me, one day at a time.</p><div class="note">Something new opens every midnight in Italy. The next button at the bottom will unlock by itself.</div></section>
 <section class="section"><div class="kicker">START HERE</div><h2>I’ll explain it myself.</h2><p>This is the only explanation page. After today, every day is different.</p>${video('Video1.mov')}</section>
 <section class="section"><div class="grid2"><div class="miniCard"><strong>5 days</strong><span>Each one has its own little mood.</span></div><div class="miniCard"><strong>1 link</strong><span>No searching. Just come back here.</span></div><div class="miniCard"><strong>Midnight</strong><span>Italy time. That part matters.</span></div><div class="miniCard"><strong>No pressure</strong><span>Open it when you feel like it.</span></div></div></section>
 <section class="section"><div class="kicker">FIRST MEMORY</div><h2>Before tomorrow…</h2><img class="fullphoto" src="IMG_9638.jpeg" alt="Us"><p>I wanted the first page to feel familiar. Like I’m not really that far away.</p><button class="softbtn" id="firstSurprise">one tiny extra</button><div class="randomBox reveal" id="firstReveal">You’re still stuck with me, even from another country. ♡</div></section>`,0);
 document.getElementById('firstSurprise').onclick=()=>document.getElementById('firstReveal').classList.add('show');
}
let bag=[];
const surprises=[
 'Remote boyfriend presence: activated.',
 'If it gets too quiet, call me. No appointment needed.',
 'I miss you. That was the whole surprise.',
 'Drink some water. Romance includes basic survival.',
 'You are allowed to do absolutely nothing for five minutes.',
 'Tiny hug delivered. Please sign here: ♡'
];
function pick(){if(!bag.length)bag=[...surprises].sort(()=>Math.random()-.5);return bag.pop()}
function day2(){
 app.innerHTML=shell(`
 <section class="hero"><div class="kicker">DAY TWO</div><h1>Press for company.</h1><p>Today is not about one thing. It’s a little vending machine for when the room gets too quiet.</p></section>
 <section class="section center"><h2>Boyfriend vending machine</h2><p>Press as many times as you want.</p><button class="bigbtn" id="rand">GIVE ME SOMETHING</button><div class="randomBox" id="randBox">waiting…</div></section>
 <section class="section"><div class="kicker">HOW ARE YOU?</div><h2>Pick your current mood.</h2><button class="choice mood" data-m="bored">I’m bored</button><button class="choice mood" data-m="tired">I’m tired</button><button class="choice mood" data-m="miss">I miss you</button><div class="moodResult" id="moodResult"></div></section>
 <section class="section"><div class="kicker">RANDOM PHOTO BREAK</div><img class="fullphoto" src="IMG_9408.jpeg" alt="Us being ridiculous"><p class="center">No context. This just had to be here.</p></section>
 <section class="section center"><div class="kicker">KISS COUNTER</div><h2>Tap until you’re satisfied.</h2><button class="kissBtn" id="kiss">♡</button><div class="counter"><span id="kissN">0</span> kisses</div><p style="font-size:12px">These are legally redeemable later.</p></section>`,1);
 document.getElementById('rand').onclick=()=>document.getElementById('randBox').textContent=pick();
 const result=document.getElementById('moodResult');
 document.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{let m=b.dataset.m;let txt=m==='bored'?'Go do one tiny thing you actually enjoy. And then send me proof.':m==='tired'?'You’re allowed to stop being productive. Get comfortable and be useless for a bit.':'Same. Annoyingly same.';result.textContent=txt;result.classList.add('show')});
 let k=0;document.getElementById('kiss').onclick=()=>{k++;document.getElementById('kissN').textContent=k};
}
function day3(){
 app.innerHTML=shell(`
 <section class="hero"><div class="kicker">DAY THREE</div><h1>A memory day.</h1><p>Not just a photo. You have to bring it back first.</p></section>
 <section class="section"><h2>Hold to develop.</h2><div class="memoryWrap" id="memory"><img src="IMG_9328.jpeg" alt="Memory"><div class="memoryOverlay" id="memOverlay"><div class="memoryChip">HOLD TO DEVELOP</div></div></div><div class="progress"><i id="prog"></i></div><div class="reveal" id="afterMem"><div class="note">I’d choose this moment again. And a lot of the ordinary ones too.</div></div></section>
 <section class="section"><div class="kicker">ONE MORE</div><h2>Okay, fine. Another one.</h2><img class="fullphoto" src="IMG_9226.jpeg" alt="Us"><p>Some memories don’t need a long caption.</p></section>
 <section class="section"><div class="kicker">TINY CHOICE</div><h2>What would you pick right now?</h2><button class="choice tinychoice">A hug</button><button class="choice tinychoice">A walk together</button><button class="choice tinychoice">Doing nothing next to each other</button><div class="moodResult" id="choiceResult"></div></section>`,2);
 setupDevelop();
 const rr=document.getElementById('choiceResult');document.querySelectorAll('.tinychoice').forEach(b=>b.onclick=()=>{rr.textContent=`Good choice. I’d pick that too.`;rr.classList.add('show')});
}
function setupDevelop(){
 const layer=document.getElementById('memOverlay'),box=document.getElementById('memory'),bar=document.getElementById('prog');let on=false,start=0,timer;const dur=1800;
 const tick=()=>{if(!on)return;let p=Math.min(1,(performance.now()-start)/dur);bar.style.width=(p*100)+'%';if(p>=1){on=false;clearInterval(timer);box.classList.add('done');document.getElementById('afterMem').classList.add('show')}};
 const begin=e=>{if(box.classList.contains('done'))return;e.preventDefault();on=true;start=performance.now();timer=setInterval(tick,30)};
 const end=()=>{if(!on)return;on=false;clearInterval(timer);bar.style.width='0%'};
 layer.addEventListener('pointerdown',begin);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
}
function day4(){
 app.innerHTML=shell(`
 <section class="hero"><div class="kicker">DAY FOUR</div><h1>Today is quieter.</h1><p>No big game first. Just something I wanted you to hear.</p></section>
 <section class="section"><div class="kicker">LISTEN</div><h2>This one is for you.</h2>${video('IMG_3836.mov')}</section>
 <section class="section"><div class="kicker">THREE THINGS</div><h2>Things I like about you today.</h2><div class="grid2"><div class="miniCard"><strong>1</strong><span>Your face when you’re trying not to laugh.</span></div><div class="miniCard"><strong>2</strong><span>The fact that you somehow make normal days feel less normal.</span></div><div class="miniCard"><strong>3</strong><span>You. Very specific, I know.</span></div><div class="miniCard"><strong>Bonus</strong><span>You’re cute when you’re annoyed. Unfortunately.</span></div></div></section>
 <section class="section"><img class="fullphoto" src="IMG_9573.jpeg" alt="Kami"><p class="center">This page needed your face on it.</p></section>
 <section class="section center"><h2>Tap once.</h2><button class="kissBtn" id="heartOne">♡</button><div class="moodResult" id="heartMsg">That’s all. I love you.</div></section>`,3);
 document.getElementById('heartOne').onclick=()=>document.getElementById('heartMsg').classList.add('show');
}
function day5(){
 app.innerHTML=shell(`
 <section class="hero"><div class="kicker">DAY FIVE</div><h1>The last proper day.</h1><p>You made it through the five. I still have a few things left.</p></section>
 <section class="section"><div class="kicker">LAST VIDEO</div><h2>Apparently I had one more.</h2>${video('IMG_3827.mov')}</section>
 <section class="section"><div class="kicker">SMALL RECAP</div><h2>Things this week contained:</h2><div class="grid2"><div class="miniCard"><strong>Too many clicks</strong><span>Because I made you press everything.</span></div><div class="miniCard"><strong>Too many photos</strong><span>Still not enough, actually.</span></div><div class="miniCard"><strong>Me bothering you</strong><span>Internationally.</span></div><div class="miniCard"><strong>One more thing</strong><span>But not yet.</span></div></div></section>
 <section class="section"><img class="fullphoto" src="IMG_3473.jpeg" alt="Us"><p>I wanted the five days to end with us, not with a button.</p></section>
 <section class="section center"><div class="kicker">HOLD FOR ME</div><h2>One final reveal.</h2><div class="holdRing" id="holdRing"><button id="holdBtn">HOLD</button></div><div class="reveal" id="finalReveal"><h2>Still here.</h2><p>Whenever it gets a little too quiet, you know where to find me.</p><p style="font-family:Georgia,serif;font-size:25px;color:var(--rose)">I love you. ♡</p></div></section>`,4);
 setupHold();
}
function setupHold(){
 let ring=document.getElementById('holdRing'),btn=document.getElementById('holdBtn'),rev=document.getElementById('finalReveal'),on=false,start=0,timer;const dur=2600;
 const tick=()=>{if(!on)return;let p=Math.min(1,(performance.now()-start)/dur);ring.style.setProperty('--p',(p*100)+'%');if(p>=1){on=false;clearInterval(timer);rev.classList.add('show')}};
 const begin=e=>{e.preventDefault();on=true;start=performance.now();timer=setInterval(tick,30)};const end=()=>{if(!on)return;on=false;clearInterval(timer);ring.style.setProperty('--p','0%')};
 btn.addEventListener('pointerdown',begin);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end)
}
function day6(){
 app.innerHTML=shell(`
 <section class="hero"><div class="kicker">ONE MORE THING</div><h1>This wasn’t actually the end.</h1><p>Something bigger is already being prepared.</p></section>
 <section class="section center"><h2>You don’t get to know what.<br>You don’t get to know when.</h2><p>But yes, this is your warning.</p><button class="bigbtn" id="clue">TRY TO GET A CLUE</button><div class="randomBox" id="clueBox">go on, try.</div><p style="font-family:Georgia,serif;font-size:29px;color:var(--rose);margin-top:24px">stay tuned. ♡</p></section>`,5);
 const a=['Nice try.','No spoilers.','Too early.','Absolutely not.','You’re not getting anything out of me.','Stay curious.','Ask again later.','You’ll know when you know.'];let i=0;document.getElementById('clue').onclick=()=>document.getElementById('clueBox').textContent=a[i++%a.length];
}
document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{sim=Number(b.dataset.test);current=sim;render()});
render();
setInterval(()=>{if(current<5){let b=document.getElementById('nextBtn');if(b){let ok=open(current+1);if(ok&&b.disabled)render();else{let c=document.getElementById('countdown');if(c)c.textContent=cd(new Date(DAYS[current+1].unlock).getTime()-now())}}}},1000);
</script></body></html>
